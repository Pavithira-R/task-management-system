version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      # Persists locally stored attachments (used when S3 is not configured)
      - uploads:/app/uploads
    restart: unless-stopped
    # If you add a database service to this file, uncomment the following:
    # depends_on:
    #   - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  uploads:
